packages:
  - "Backend/*"
  - "Frontend/*"
  - "Infrastructure/migration"

# Required by pnpm 10's lockfile-based deploy implementation. GestSchool does
# not currently have cross-workspace runtime dependencies, so this changes only
# deployment packaging while keeping the install graph pinned by pnpm-lock.yaml.
injectWorkspacePackages: true

# Security overrides apply to pnpm 10 builds and the isolated pnpm 11 audit
# gate. Each selector is limited to its documented vulnerable range.
overrides:
  "@babel/core@<=7.29.0": "7.29.6"
  "ajv@<6.14.0": "6.14.0"
  "ajv@>=7.0.0-alpha.0 <8.18.0": "8.18.0"
  "brace-expansion@<1.1.16": "1.1.16"
  "brace-expansion@>=5.0.0 <5.0.8": "5.0.8"
  "fast-uri@<=3.1.3": "3.1.4"
  "flatted@<=3.4.1": "3.4.2"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "picomatch@<2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "postcss@<8.5.18": "8.5.18"
  "rollup@>=4.0.0 <4.59.0": "4.59.0"
  "undici@>=7.0.0 <7.28.0": "7.28.0"
