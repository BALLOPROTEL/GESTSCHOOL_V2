packages:
  - "Backend/*"
  - "Frontend/*"
  - "Infrastructure/migration"

# Required by pnpm 10's lockfile-based deploy implementation. GestSchool does
# not currently have cross-workspace runtime dependencies, so this changes only
# deployment packaging while keeping the install graph pinned by pnpm-lock.yaml.
injectWorkspacePackages: true

# Security overrides apply to pnpm 10 builds and the isolated pnpm 11 audit
# gate. Each selector is limited to its documented vulnerable range.
overrides:
  "vite@>=7.0.0 <7.3.7": "7.3.7"
  "handlebars@>=4.0.0 <4.7.10": "4.7.10"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "browserslist@<4.28.9": "4.28.9"
  "@nestjs/platform-express@>=11.0.0 <11.2.6": "11.2.6"
  "@babel/core@<=7.29.0": "7.29.6"
  "ajv@<6.14.0": "6.14.0"
  "ajv@>=7.0.0-alpha.0 <8.18.0": "8.18.0"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "multer@>=2.0.0 <2.5.0": "2.5.0"
  "proxy-addr@>=2.0.0 <2.0.8": "2.0.8"
  "qs@>=6.0.0 <6.16.1": "6.16.1"
  "sharp@>=0.35.0 <0.35.5": "0.35.5"
  "deepmerge-ts@<8.0.0": "8.0.0"
  "fast-uri@>=3.0.0 <3.1.7": "3.1.7"
  "flatted@<=3.4.1": "3.4.2"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "picomatch@<2.3.2": "2.3.2"
