# Example single-domain reverse proxy for Al Manarat + GestSchool.
# Replace the upstream hosts with the real Render/Vercel origins.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name almanarat.example.com;

  client_max_body_size 25m;

  location /api/v1/ {
    proxy_pass https://gestschool-api.onrender.com/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host gestschool-api.onrender.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/site/ {
    proxy_pass https://al-manarat-public.onrender.com/api/site/;
    proxy_http_version 1.1;
    proxy_set_header Host al-manarat-public.onrender.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # GestSchool remains built as a normal Vite SPA. The proxy strips /gestion.
  location /gestion/ {
    proxy_pass https://gestschool-web.vercel.app/;
    proxy_http_version 1.1;
    proxy_set_header Host gestschool-web.vercel.app;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /gestion {
    return 302 /gestion/;
  }

  location /admin-site/ {
    proxy_pass https://al-manarat-public.onrender.com/admin-site/;
    proxy_http_version 1.1;
    proxy_set_header Host al-manarat-public.onrender.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /admin-site {
    return 302 /admin-site/;
  }

  location / {
    proxy_pass https://al-manarat-public.onrender.com/;
    proxy_http_version 1.1;
    proxy_set_header Host al-manarat-public.onrender.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
