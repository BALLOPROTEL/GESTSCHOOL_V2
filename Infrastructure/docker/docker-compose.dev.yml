services:
  postgres:
    image: postgres:16.14-bookworm
    container_name: gestschool-postgres
    environment:
      POSTGRES_USER: gestschool
      POSTGRES_PASSWORD: gestschool
      POSTGRES_DB: gestschool
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestschool -d gestschool"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.7-bookworm
    container_name: gestschool-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
