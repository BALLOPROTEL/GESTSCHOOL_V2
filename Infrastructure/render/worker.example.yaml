# Deliberately not included from the root render.yaml.
# Render background workers have no free plan. Create this paid service only after
# approving the operational cost and copying the API secrets/environment group.
services:
  - type: worker
    name: gestschool-worker
    runtime: node
    plan: starter
    autoDeploy: false
    buildCommand: >
      corepack enable &&
      corepack prepare pnpm@10.24.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm render:build:api
    startCommand: pnpm render:start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: GESTSCHOOL_RUNTIME_ENV
        value: staging
      - key: GESTSCHOOL_PROCESS_ROLE
        value: worker
      - key: WORKER_HEALTH_HOST
        value: 0.0.0.0
      - key: WORKER_HEALTH_PORT
        value: "10001"
      - key: NOTIFICATIONS_WORKER_ENABLED
        value: "true"
      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "true"
      - key: NOTIFICATIONS_SMS_ENABLED
        value: "false"
      - key: ALLOW_MOCK_NOTIFICATION_PROVIDERS_IN_RC
        value: "false"
      - key: OUTBOX_IN_PROCESS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NOTIFICATIONS_EMAIL_PROVIDER
        value: brevo
      - key: NOTIFICATIONS_SMS_PROVIDER
        value: mock
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Al Manarat Islamiyat
      - key: BREVO_SMS_DRY_RUN
        value: "true"
      - key: ALLOW_REAL_SMS
        value: "false"
      - key: BREVO_TIMEOUT_MS
        value: "8000"
