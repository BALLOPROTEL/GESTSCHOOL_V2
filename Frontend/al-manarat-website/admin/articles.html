<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles — Admin Al Manarat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-brand">
      <img src="/assets/logo.png" alt="Logo" class="sidebar-brand-logo" onerror="this.style.display='none'" />
      <div><div class="sidebar-brand-name">Al Manarat</div><div class="sidebar-brand-sub">Dashboard Admin</div></div>
    </div>
    <nav class="sidebar-nav">
      <span class="sidebar-section-title">Navigation</span>
      <a href="/admin-site/dashboard.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span> Tableau de bord</a>
      <a href="/admin-site/articles.html" class="sidebar-link"><span class="sidebar-link-icon">📝</span> Articles</a>
      <a href="/admin-site/evenements.html" class="sidebar-link"><span class="sidebar-link-icon">📅</span> Événements</a>
      <a href="/admin-site/galerie.html" class="sidebar-link"><span class="sidebar-link-icon">🖼️</span> Galerie</a>
      <span class="sidebar-section-title">Soumissions</span>
      <a href="/admin-site/candidatures.html" class="sidebar-link"><span class="sidebar-link-icon">📋</span> Candidatures <span class="sidebar-badge" id="badgeCandidatures" style="display:none"></span></a>
      <a href="/admin-site/messages.html" class="sidebar-link"><span class="sidebar-link-icon">✉️</span> Messages <span class="sidebar-badge" id="badgeMessages" style="display:none"></span></a>
      <a href="/admin-site/newsletter.html" class="sidebar-link"><span class="sidebar-link-icon">📧</span> Newsletter</a>
      <span class="sidebar-section-title">Configuration</span>
      <a href="/admin-site/contenus.html" class="sidebar-link"><span class="sidebar-link-icon">🎨</span> Contenu pages</a>
      <a href="/admin-site/parametres.html" class="sidebar-link"><span class="sidebar-link-icon">⚙️</span> Paramètres</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebarUsername">Admin</div><div class="sidebar-user-role" id="sidebarRole">Super Admin</div></div>
      </div>
      <button class="btn-logout" data-action="logout">🚪 Se déconnecter</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="btn-icon btn-burger" id="adminBurger">☰</button>
      <div class="topbar-title"><h1>Articles</h1><p>Gérer les actualités et publications</p></div>
      <div class="topbar-actions">
        <a href="/admin-site/article-form.html" class="btn btn-primary btn-sm">✏️ Nouvel article</a>
      </div>
    </header>

    <div class="admin-content">
      <div class="admin-table-wrap">
        <div class="admin-table-header">
          <h3>Tous les articles <span id="articleCount" style="color:var(--color-text-muted);font-weight:400;font-size:.85rem"></span></h3>
          <div class="admin-table-actions">
            <input type="search" class="search-input" id="searchInput" placeholder="🔍 Rechercher..." />
            <select class="filter-select" id="filterStatus">
              <option value="">Tous</option>
              <option value="published">Publiés</option>
              <option value="draft">Brouillons</option>
            </select>
            <select class="filter-select" id="filterCat">
              <option value="">Toutes catégories</option>
              <option value="general">Général</option>
              <option value="resultats">Résultats</option>
              <option value="admissions">Admissions</option>
              <option value="evenements">Événements</option>
            </select>
          </div>
        </div>
        <div id="tableContainer">
          <div class="page-loader"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let allArticles = [];

    async function loadArticles() {
      try {
        allArticles = await API.adminGetArticles();
        renderTable(allArticles);
      } catch (e) {
        Admin.showToast('Erreur chargement articles: ' + e.message, 'error');
      }
    }

    function renderTable(articles) {
      document.getElementById('articleCount').textContent = `(${articles.length})`;
      if (!articles.length) {
        document.getElementById('tableContainer').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <h3>Aucun article trouvé</h3>
            <p>Créez votre premier article avec le bouton ci-dessus</p>
          </div>`;
        return;
      }

      const catLabels = { general:'Général', resultats:'Résultats', admissions:'Admissions', evenements:'Événements' };

      document.getElementById('tableContainer').innerHTML = `
        <table class="admin-table">
          <thead><tr>
            <th>Titre</th><th>Catégorie</th><th>Auteur</th><th>Statut</th><th>Date</th><th>Actions</th>
          </tr></thead>
          <tbody>
            ${articles.map(a => `
              <tr>
                <td class="td-title">
                  <div>${Admin.escape(a.title)}</div>
                  ${a.excerpt ? `<div class="td-meta" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Admin.escape(a.excerpt)}</div>` : ''}
                </td>
                <td><span class="badge badge-green">${catLabels[a.category] || a.category}</span></td>
                <td>${Admin.escape(a.author || '—')}</td>
                <td>${Admin.getStatusBadge(a.status)}</td>
                <td class="td-meta">${Admin.formatDateShort(a.publishedAt || a.createdAt)}</td>
                <td>
                  <div class="table-actions">
                    <button class="btn-icon btn-icon-edit" title="Modifier" onclick="location.href='/admin-site/article-form.html?id=${a._id}'">✏️</button>
                    <button class="btn-icon btn-icon-toggle" title="${a.status==='published'?'Dépublier':'Publier'}" onclick="toggleArticle('${a._id}', this)">
                      ${a.status === 'published' ? '🔒' : '🚀'}
                    </button>
                    <button class="btn-icon btn-icon-delete" title="Supprimer" onclick="deleteArticle('${a._id}')">🗑️</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    async function toggleArticle(id, btn) {
      try {
        const result = await API.adminToggleArticle(id);
        Admin.showToast(result.status === 'published' ? 'Article publié ✅' : 'Article dépublié');
        loadArticles();
      } catch (e) { Admin.showToast(e.message, 'error'); }
    }

    async function deleteArticle(id) {
      if (!await Admin.confirm('Supprimer cet article définitivement ?')) return;
      try {
        await API.adminDeleteArticle(id);
        Admin.showToast('Article supprimé');
        loadArticles();
      } catch (e) { Admin.showToast(e.message, 'error'); }
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const cat    = document.getElementById('filterCat').value;
      renderTable(allArticles.filter(a =>
        (!search || a.title.toLowerCase().includes(search) || (a.excerpt||'').toLowerCase().includes(search)) &&
        (!status || a.status === status) &&
        (!cat    || a.category === cat)
      ));
    }

    document.addEventListener('DOMContentLoaded', () => {
      Admin.init();
      loadArticles();
      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('filterStatus').addEventListener('change', applyFilters);
      document.getElementById('filterCat').addEventListener('change', applyFilters);
    });
  </script>
</body>
</html>
