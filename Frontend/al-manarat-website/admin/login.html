<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Admin Al Manarat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .login-divider { height:1px; background:linear-gradient(90deg,transparent,#e5e7eb,transparent); margin:20px 0; }
    .login-info { background:var(--emerald-50); border:1px solid var(--emerald-100); border-radius:var(--radius-sm); padding:12px 14px; font-size:.82rem; color:var(--emerald-800); margin-bottom:16px; }
    .input-group { position:relative; }
    .input-group .form-control { padding-right:42px; }
    .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid var(--emerald-100);
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      color: var(--emerald-800);
      cursor: pointer;
      font: inherit;
      font-size: .72rem;
      font-weight: 800;
      line-height: 1;
      padding: 7px 9px;
    }
  </style>
</head>
<body class="admin-login-body">
  <div class="login-box">
    <div class="login-logo">
      <img src="/assets/logo.png" alt="Logo Al Manarat" onerror="this.style.display='none'" />
      <h1>Al Manarat</h1>
      <p>Espace Administrateur</p>
    </div>

    <div class="login-info">
      Accès réservé au personnel autorisé
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group" style="margin-bottom:14px">
        <label for="email">Adresse email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@almanarat.sn" required autocomplete="email" />
      </div>
      <div class="form-group" style="margin-bottom:20px">
        <label for="password">Mot de passe</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Afficher le mot de passe">Voir</button>
        </div>
      </div>
      <div id="loginError" style="display:none;margin-bottom:14px" class="alert alert-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        <span id="btnText">Se connecter</span>
      </button>
    </form>

    <div class="login-divider"></div>
    <p style="text-align:center;font-size:.78rem;color:var(--color-text-muted)">
      <a href="/index.html" style="color:var(--emerald-700)">← Retour au site public</a>
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const adminBasePath = window.location.pathname.startsWith('/admin-site') ? '/admin-site' : '/admin';
    const adminPath = (pathname) => `${adminBasePath}/${pathname.replace(/^\/+/, '')}`;

    // Redirect if already logged in
    (function() {
      const token = localStorage.getItem('am_token');
      if (token) {
        try {
          const p = JSON.parse(atob(token.split('.')[1]));
          if (p.exp * 1000 > Date.now()) window.location.href = adminPath('dashboard.html');
        } catch {}
      }
    })();

    const form  = document.getElementById('loginForm');
    const errEl = document.getElementById('loginError');
    const btn   = document.getElementById('submitBtn');
    const btnTxt= document.getElementById('btnText');

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      this.textContent = input.type === 'password' ? 'Voir' : 'Masquer';
      this.setAttribute('aria-label', input.type === 'password' ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      btn.disabled = true;
      btnTxt.textContent = 'Connexion...';

      try {
        const data = await API.adminLogin(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        localStorage.setItem('am_token', data.token);
        localStorage.setItem('am_user', JSON.stringify(data.admin));
        window.location.href = adminPath('dashboard.html');
      } catch (err) {
        errEl.textContent = err.message || 'Identifiants incorrects';
        errEl.style.display = 'flex';
        btn.disabled = false;
        btnTxt.textContent = 'Se connecter';
        document.getElementById('password').value = '';
      }
    });
  </script>
</body>
</html>
